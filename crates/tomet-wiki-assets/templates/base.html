<!DOCTYPE html>
<html lang="{{ lang }}" data-theme="auto" data-view="wiki">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}{{ site_title }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ base_path }}/wiki.css" />
  <link rel="stylesheet" href="{{ base_path }}/wiki-editor.css" />
  <script>
    (function() {
      const theme = localStorage.getItem('tmt-wiki-theme') || 'auto';
      if (theme === 'dark' || (theme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.setAttribute('data-theme', 'dark');
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
      }
      if (localStorage.getItem('tmt_github_token')) {
        document.documentElement.setAttribute('data-auth', 'true');
      }
    })();
  </script>
</head>
<body>
  <header class="tmt-wiki-header">
    <div class="tmt-wiki-header-inner">
      <div class="tmt-wiki-header-left">
        <a href="{{ home_url }}" class="tmt-wiki-brand">{{ site_title }}</a>
      </div>
      <div class="tmt-wiki-header-search">
        <button type="button" class="tmt-wiki-search-btn" id="tmt-wiki-search-trigger" aria-label="Search">
          <svg class="tmt-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <span class="tmt-search-placeholder">Search...</span>
          <kbd class="tmt-search-kbd">/</kbd>
        </button>
      </div>
      <div class="tmt-wiki-header-actions">
        <button type="button" class="tmt-wiki-btn tmt-auth-only" id="tmt-wiki-new-btn" title="Create a new page">
          <svg class="tmt-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          <span>New</span>
        </button>
        {% block header_actions %}
        {% endblock %}
        <div id="tmt-wiki-auth-container" class="tmt-wiki-auth">
          <button type="button" class="tmt-wiki-btn" id="tmt-wiki-login-btn">Log in</button>
        </div>
        <button type="button" class="tmt-wiki-theme-toggle" id="tmt-wiki-theme-toggle" aria-label="Toggle theme">
          <svg class="tmt-icon-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
          <svg class="tmt-icon-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Inline Svelte Editor mount root -->
  <div id="tmt-wiki-editor-root"></div>

  {% block content %}{% endblock %}

  <script>
    window.tmtBasePath = {{ base_path|json }};
    window.tmtUrlPrefix = {{ clean_url_prefix|json }};
    window.tmtFullUrlPrefix = {{ full_url_prefix|json }};
    window.tmtHomeUrl = {{ home_url|json }};
    window.tmtStrings = {{ strings_json|safe }};
    window.tmtWikiCms = {{ cms_json|safe }};
  </script>
  <script src="{{ base_path }}/wiki.js"></script>
</body>
</html>
